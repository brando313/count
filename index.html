<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Big Random Number</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #num {
      font-family: Arial, Helvetica, sans-serif;
      font-weight: 900;
      font-size: 90vh; /* nearly full screen height */
      line-height: 1;
      color: #000;
      user-select: none;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="num">1</div>
  <script>
    const el = document.getElementById('num');
    function changeNumber() {
      const newNum = Math.floor(Math.random() * 9) + 1; // random 1–9
      el.textContent = newNum;
    }
    setInterval(changeNumber, 2000); // every 2 seconds
  </script>
</body>
</html>
